<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <img src="logo.png" class="logo">

        <h1>TRADE WITH SAGAR</h1>

        <p class="sub">
            Join Our Free Trading Community
        </p>

        <form id="registerForm">

            <input type="text" id="name" placeholder="Full Name"
pattern="[A-Za-z ]{3,50}"
title="Only letters and spaces are allowed"
required>

            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

            <input type="tel" id="phone"
placeholder="Mobile Number"
pattern="[6-9]{1}[0-9]{9}"
maxlength="10"
title="Enter a valid 10-digit Indian mobile number"
required>

            <label class="check">
            <!-- Terms & Conditions Popup -->


                                            <label>
  <input type="checkbox" id="agree">
  I agree to <a href="#" onclick="showTerms()">Terms & Conditions</a>
</label>

<b>6.</b> By registering, you agree to join our WhatsApp community.<br><br>

<b>7.</b> Your Name, Email and Mobile Number are used only for registration purposes.
  </p>
</div>

<br>

<button id="submitBtn" disabled class="small-btn">Submit</button>


<style>
.small-btn{
  padding: 6px 18px;
  font-size: 14px;
  border-radius: 5px;
  cursor: pointer;
}
</style>


<script>
function showTerms(){
  document.getElementById("termsBox").style.display="block";
}

document.getElementById("agree").addEventListener("change",function(){
  document.getElementById("submitBtn").disabled = !this.checked;
});
                </script>

</script>

        </form>

        <div class="buttons">

            <a
            href="https://www.youtube.com/channel/UC9mDI1JI5qJYjhx6UIeFSSw"
            target="_blank">

            </a>

            <a
            href="https://chat.whatsapp.com/ExbQZhlNualCx391fBC0nN"
            target="_blank">

            💬 WhatsApp

            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>
